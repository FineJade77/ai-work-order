# One Postgres instance, one database per service (deploy/postgres/init-databases.sql).
# Startup order: postgres -> db-init -> <service>-migrate -> (<service>-seed) -> <service>.
# Seeds are local demo data (idempotent), so `docker compose up -d --build` yields a usable stack.
# The work_order superuser is for db-init and test fixtures only; services never use it.
# It has no database of its own: it connects to the built-in 'postgres' maintenance database.
# Telemetry: every service sends traces, metrics and logs over OTLP to `observability`
# (grafana/otel-lgtm: collector + Tempo + Prometheus + Loki + Grafana, http://localhost:23000).

x-otel-env: &otel-env
  OTEL_SDK_DISABLED: "false"  # the images default to true
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf  # only the HTTP exporter is installed; the default is gRPC
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"  # also ship log records, not just stdout
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=ai-work-order,deployment.environment.name=local
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

services:
  observability:
    # One container for learning and local use; production runs these as separate components.
    # Data lives in the container: recreating it starts from empty.
    image: grafana/otel-lgtm:0.33.1
    environment:
      # A counter series is born at its first increment (value 1), so without a zero sample at its
      # OTLP start time, increase()/rate() never see that first event: fatal for rare counters
      # such as approvals. This writes the zero.
      PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion
    ports:
      - "23000:3000"   # Grafana
      - "24317:4317"   # OTLP gRPC
      - "24318:4318"   # OTLP HTTP
      - "23200:3200"   # Tempo query API
      - "23100:3100"   # Loki query API
      - "29090:9090"   # Prometheus
    volumes:
      # Dashboards and alert rules as code (deploy/observability/grafana), provisioned at startup.
      - ./deploy/observability/grafana/dashboards:/otel-lgtm/ai-work-order/dashboards:ro
      - ./deploy/observability/grafana/provisioning/dashboards/ai-work-order.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ai-work-order.yaml:ro
      - ./deploy/observability/grafana/provisioning/alerting/ai-work-order.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/ai-work-order.yaml:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: work_order
      POSTGRES_PASSWORD: work_order
      POSTGRES_DB: postgres
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_order -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: work_order
    volumes:
      - ./deploy/postgres/init-databases.sql:/init-databases.sql:ro
    command: ["psql", "-h", "postgres", "-U", "work_order", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/init-databases.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  app-service-migrate:
    build: ./services/app-service
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_service_owner:app_service_owner_dev@postgres:5432/app_service
    depends_on:
      db-init:
        condition: service_completed_successfully

  app-service-seed:
    build: ./services/app-service
    command: ["python", "scripts/seed.py"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_service_owner:app_service_owner_dev@postgres:5432/app_service
    depends_on:
      app-service-migrate:
        condition: service_completed_successfully

  app-service:
    build: ./services/app-service
    ports:
      - "8001:8001"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: app-service
      DATABASE_URL: postgresql+psycopg://app_service_app:app_service_app_dev@postgres:5432/app_service
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-any-real-deployment}
      TICKET_SERVICE_URL: http://ticket-service:8006
      TICKET_SERVICE_TOKEN: ${TICKET_SERVICE_TOKEN:-dev-ticket-service-token}
      TOOL_GATEWAY_URL: http://tool-gateway:8003  # approvals (HITL)
      TOOL_GATEWAY_SERVICE_TOKEN: ${TOOL_GATEWAY_SERVICE_TOKEN:-dev-tool-gateway-token}
    depends_on:
      observability:
        condition: service_started
      app-service-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ticket-service:
        condition: service_started

  agent-runtime-migrate:
    build: ./services/agent-runtime
    command: ["python", "-m", "app.migrate"]
    environment:
      # Plain psycopg conninfo (no +psycopg): the LangGraph checkpointer talks to psycopg directly.
      MIGRATION_DATABASE_URL: postgresql://agent_runtime_owner:agent_runtime_owner_dev@postgres:5432/agent_runtime
    depends_on:
      db-init:
        condition: service_completed_successfully

  # A queue worker: no published port. /livez and /readyz on 8002 are for probes only.
  agent-runtime:
    build: ./services/agent-runtime
    # SIGTERM starts a drain of up to SHUTDOWN_DRAIN_SECONDS (70 s); compose's default 10 s would
    # SIGKILL it partway.
    stop_grace_period: 90s
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: agent-runtime
      REDIS_URL: redis://redis:6379/0
      CHECKPOINT_DATABASE_URL: postgresql://agent_runtime_app:agent_runtime_app_dev@postgres:5432/agent_runtime
      TOOL_GATEWAY_URL: http://tool-gateway:8003
      TOOL_GATEWAY_SERVICE_TOKEN: ${TOOL_GATEWAY_SERVICE_TOKEN:-dev-tool-gateway-token}
      AI_GATEWAY_URL: http://ai-gateway:8004
      AI_GATEWAY_SERVICE_TOKEN: ${AI_GATEWAY_SERVICE_TOKEN:-dev-ai-gateway-token}
    depends_on:
      observability:
        condition: service_started
      redis:
        condition: service_healthy
      agent-runtime-migrate:
        condition: service_completed_successfully
      tool-gateway:
        condition: service_started
      ai-gateway:
        condition: service_started

  tool-gateway-migrate:
    build: ./services/tool-gateway
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://tool_gateway_owner:tool_gateway_owner_dev@postgres:5432/tool_gateway
    depends_on:
      db-init:
        condition: service_completed_successfully

  tool-gateway-seed:
    build: ./services/tool-gateway
    command: ["python", "scripts/seed.py"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://tool_gateway_owner:tool_gateway_owner_dev@postgres:5432/tool_gateway
    depends_on:
      tool-gateway-migrate:
        condition: service_completed_successfully

  tool-gateway:
    build: ./services/tool-gateway
    ports:
      - "8003:8003"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: tool-gateway
      DATABASE_URL: postgresql+psycopg://tool_gateway_app:tool_gateway_app_dev@postgres:5432/tool_gateway
      TOOL_GATEWAY_SERVICE_TOKEN: ${TOOL_GATEWAY_SERVICE_TOKEN:-dev-tool-gateway-token}
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8005
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-dev-knowledge-service-token}
      TICKET_SERVICE_URL: http://ticket-service:8006
      TICKET_SERVICE_TOKEN: ${TICKET_SERVICE_TOKEN:-dev-ticket-service-token}
      REDIS_URL: redis://redis:6379/0  # approval decisions go out on the approval_events stream
    depends_on:
      observability:
        condition: service_started
      redis:
        condition: service_healthy
      tool-gateway-seed:
        condition: service_completed_successfully
      knowledge-service:
        condition: service_started
      ticket-service:
        condition: service_started

  ai-gateway-migrate:
    build: ./services/ai-gateway
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://ai_gateway_owner:ai_gateway_owner_dev@postgres:5432/ai_gateway
    depends_on:
      db-init:
        condition: service_completed_successfully

  ai-gateway:
    build: ./services/ai-gateway
    ports:
      - "8004:8004"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ai-gateway
      # Prompts and replies on model-call spans (masked, truncated): on for local development only.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
      DATABASE_URL: postgresql+psycopg://ai_gateway_app:ai_gateway_app_dev@postgres:5432/ai_gateway
      MODEL_BASE_URL: https://api.deepseek.com
      MODEL_NAME: deepseek-chat
      MODEL_API_KEY: ${DEEPSEEK_API_KEY}
      AI_GATEWAY_SERVICE_TOKEN: ${AI_GATEWAY_SERVICE_TOKEN:-dev-ai-gateway-token}
    depends_on:
      observability:
        condition: service_started
      ai-gateway-migrate:
        condition: service_completed_successfully

  knowledge-service:
    build: ./services/knowledge-service
    ports:
      - "8005:8005"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: knowledge-service
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-dev-knowledge-service-token}
    depends_on:
      observability:
        condition: service_started

  ticket-service-migrate:
    build: ./services/ticket-service
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://ticket_service_owner:ticket_service_owner_dev@postgres:5432/ticket_service
    depends_on:
      db-init:
        condition: service_completed_successfully

  ticket-service:
    build: ./services/ticket-service
    ports:
      - "8006:8006"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ticket-service
      DATABASE_URL: postgresql+psycopg://ticket_service_app:ticket_service_app_dev@postgres:5432/ticket_service
      TICKET_SERVICE_TOKEN: ${TICKET_SERVICE_TOKEN:-dev-ticket-service-token}
    depends_on:
      observability:
        condition: service_started
      ticket-service-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
