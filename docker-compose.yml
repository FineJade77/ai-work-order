services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: work_order
      POSTGRES_PASSWORD: work_order
      POSTGRES_DB: work_order
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_order"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-service:
    build: ./services/app-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-runtime:
    build: ./services/agent-runtime
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tool-gateway:
    build: ./services/tool-gateway
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  ai-gateway:
    build: ./services/ai-gateway
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    build: ./libs/shared
    environment:
      DATABASE_URL: postgresql+psycopg://work_order:work_order@postgres:5432/work_order
      APP_DATABASE_URL: postgresql+psycopg://app_runtime:app_runtime_dev_password@postgres:5432/work_order
      APP_DB_PASSWORD: app_runtime_dev_password
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
