# Demo tenants, users and tool bindings (same as the compose *-seed services). Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: app-service-seed
  labels:
    app.kubernetes.io/name: app-service-seed
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-service-seed
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ai-work-order/app-service
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/seed.py"]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-service-database
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
