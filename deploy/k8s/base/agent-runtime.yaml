# Queue worker: no Service. Port 8002 serves /healthz for the probes only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: app
spec:
  replicas: 1  # fixed here; components/autoscaling adds an HPA or KEDA ScaledObject
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ai-work-order/agent-runtime
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8002
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: service-endpoints
                  key: REDIS_URL
            - name: CHECKPOINT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-runtime-database
                  key: CHECKPOINT_DATABASE_URL
            - name: TOOL_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-endpoints
                  key: TOOL_GATEWAY_URL
            - name: TOOL_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-tokens
                  key: TOOL_GATEWAY_SERVICE_TOKEN
            - name: AI_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-endpoints
                  key: AI_GATEWAY_URL
            - name: AI_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-tokens
                  key: AI_GATEWAY_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-runtime-migrate
  labels:
    app.kubernetes.io/name: agent-runtime-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ai-work-order/agent-runtime
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.migrate"]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-runtime-database
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
