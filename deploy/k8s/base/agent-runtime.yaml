# Queue worker: no Service. Port 8002 serves /livez and /readyz for the probes only.
# On SIGTERM it drains: takes no more tasks, lets the ones in flight finish (SHUTDOWN_DRAIN_SECONDS,
# 70 s by default, above the 60 s task timeout), hands back any it had to cut off and leaves the
# consumer group; the grace period below must be longer than that drain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: app
spec:
  replicas: 1  # fixed here; components/autoscaling adds an HPA or KEDA ScaledObject
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # the new pod takes tasks while the old one drains
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90  # > SHUTDOWN_DRAIN_SECONDS, or SIGKILL cuts the drain short
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ai-work-order/agent-runtime
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8002
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: service-endpoints
                  key: REDIS_URL
            - name: CHECKPOINT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-runtime-database
                  key: CHECKPOINT_DATABASE_URL
            - name: TOOL_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-endpoints
                  key: TOOL_GATEWAY_URL
            - name: TOOL_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-tokens
                  key: TOOL_GATEWAY_SERVICE_TOKEN
            - name: AI_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-endpoints
                  key: AI_GATEWAY_URL
            - name: AI_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-tokens
                  key: AI_GATEWAY_SERVICE_TOKEN
          # Startup connects to Redis and Postgres before the probes' port opens.
          startupProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 2
            failureThreshold: 30
          # Not ready while draining (kubectl and rollout status show it); nothing routes to it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          # Still alive while draining: failing here would get the pod killed mid-drain.
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Voluntary disruptions (node drains, cluster upgrades) evict one worker at a time; each drains
# first. maxUnavailable rather than minAvailable: with a single replica, minAvailable: 1 would
# block every node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-runtime-migrate
  labels:
    app.kubernetes.io/name: agent-runtime-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ai-work-order/agent-runtime
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.migrate"]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-runtime-database
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
