apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  labels:
    app.kubernetes.io/name: ticket-service
    app.kubernetes.io/component: app
spec:
  replicas: 1  # fixed here; components/autoscaling adds an HPA or KEDA ScaledObject
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-service
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ticket-service
          image: ai-work-order/ticket-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8006
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ticket-service-database
                  key: DATABASE_URL
            - name: TICKET_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-tokens
                  key: TICKET_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  labels:
    app.kubernetes.io/name: ticket-service
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: ticket-service
  ports:
    - name: http
      port: 8006
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ticket-service-migrate
  labels:
    app.kubernetes.io/name: ticket-service-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-service-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the USER in every service Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ai-work-order/ticket-service
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ticket-service-database
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
