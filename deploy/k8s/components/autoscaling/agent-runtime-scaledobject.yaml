# agent-runtime scales on queue backlog, not CPU: its tasks mostly wait on the model (needs KEDA).
# lagCount counts entries not yet delivered to the consumer group (KEDA 2.12+, Redis 7+; check the
# field names against the installed KEDA's redis-streams scaler). pendingEntriesCount would be the
# wrong signal: each replica only takes as many tasks as it runs (WORKER_CONCURRENCY, default 8),
# so pending entries plateau at 8 x replicas however long the queue grows.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-runtime
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    name: agent-runtime
  minReplicaCount: 1
  maxReplicaCount: 20
  # Scale out at once, scale in slowly: every pod removed drains its tasks first, and a backlog
  # that dips for a minute should not cost a scale-in and a scale-out.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  triggers:
    - type: redis-streams
      metadata:
        address: redis:6379
        stream: agent_tasks
        consumerGroup: agent_runtime
        lagCount: "8"
