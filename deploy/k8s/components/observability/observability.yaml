# grafana/otel-lgtm, the same all-in-one backend compose runs. Data is in the pod (emptyDir):
# a restart starts from empty. Dev clusters only (see kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/component: app  # deployed with the services by apply-dev.sh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.33.1
          env:
            # A zero sample at each counter's OTLP start time, so increase() counts its first event.
            - {name: PROMETHEUS_EXTRA_ARGS, value: --enable-feature=created-timestamp-zero-ingestion}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe:
            httpGet: {path: /api/health, port: grafana}
            periodSeconds: 10
            failureThreshold: 60  # Grafana initialises its database on first start, which can take minutes
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 3Gi}
          volumeMounts:
            - name: dashboards
              mountPath: /otel-lgtm/ai-work-order/dashboards
              readOnly: true
            - name: provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/ai-work-order.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/ai-work-order.yaml
              subPath: alerting.yaml
              readOnly: true
      volumes:
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: provisioning
          configMap: {name: grafana-provisioning}
---
apiVersion: v1
kind: Service
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: observability
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 9090, targetPort: 9090}  # queried by KEDA (components/autoscaling)
