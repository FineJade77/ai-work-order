# Optional: add under `components:` in an overlay. Turns on OpenTelemetry in the six services and
# deploys the same all-in-one backend as compose (grafana/otel-lgtm: collector, Tempo, Prometheus,
# Loki, Grafana) with the dashboards and alert rules from deploy/observability/grafana.
#
# For development clusters. In production, run the collector (e.g. the OTel Operator) and the
# backends as separate, persistent components and point OTEL_EXPORTER_OTLP_ENDPOINT at the
# collector (architecture-design.md section 5). Message content is not recorded here
# (OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT unset); compose turns it on for local work.
#
# Rendering needs --load-restrictor LoadRestrictionsNone (the Grafana files are shared with
# compose); apply-dev.sh already passes it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - observability.yaml

configMapGenerator:
  - name: otel-env
    options:
      # A fixed name: the patch below refers to it, and references added by a patch are not
      # rewritten to the hashed name. Changing these settings therefore needs a rollout restart.
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/component: config
    literals:
      - OTEL_SDK_DISABLED=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=ai-work-order,deployment.environment.name=k8s-dev
      - OTEL_METRIC_EXPORT_INTERVAL=15000
  - name: grafana-dashboards
    options:
      labels:
        app.kubernetes.io/component: config
    files:
      - overview.json=../../../observability/grafana/dashboards/overview.json
      - turn.json=../../../observability/grafana/dashboards/turn.json
  - name: grafana-provisioning
    options:
      labels:
        app.kubernetes.io/component: config
    files:
      - dashboards.yaml=../../../observability/grafana/provisioning/dashboards/ai-work-order.yaml
      - alerting.yaml=../../../observability/grafana/provisioning/alerting/ai-work-order.yaml

patches:
  # Every service Deployment (not the backend itself): the shared OTEL_* settings, and a service
  # name taken from the pod's app.kubernetes.io/name label, so one patch fits all six.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=app,app.kubernetes.io/name!=observability
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: otel-env
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app.kubernetes.io/name']
